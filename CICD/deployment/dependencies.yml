# CICD/deployment/dependencies.yml — its-dp-fab-ucs-referentiel-managed (UCS Referentiel)
# Fichier propre à la chaîne KPMG (lu par le socle its-dp-fab-cicd-common, pas par fabric-cicd).
# inventory_status: pending -> la CD refuse toute publication (code 3) tant que l'inventaire
# des références n'a pas été revérifié sur la branche réelle (deploy.py validate sans erreur).
# ── schema_version — version du format de ce fichier (lu par le socle, pas par fabric-cicd)
schema_version: 1
# ── repository — nom du depot decrit
repository: its-dp-fab-ucs-referentiel-managed
# v1.3 — category ucs : AUCUNE dépendance de déploiement (R5). UCS peut consommer des données
#   d'autres workspaces, mais ni le Framework, ni un ADP, ni un BDP ne conditionne son
#   déploiement : aucun pré-vol Framework, aucune porte ADO, aucun ordre.
# ── role — producer (framework) ou consumer (ADP/BDP/UCS)
role: consumer
# ── category — framework | adp | bdp | ucs : pilote les regles de dependance v1.3
category: ucs
# ── inventory_status — 'pending' BLOQUE la publication tant que l'inventaire n'est pas revalide
inventory_status: pending
# ── framework — prerequis Framework : sans objet pour UCS
framework:
  # false obligatoire, sans workspace, items ni ado_gate (sinon DEPS_UCS_INDEPENDENT).
  required: false
# upstreams (v1.1-v1.2) : interdit en v1.3 (DEPS_UPSTREAM_FORBIDDEN).
#
# Dépendances classées par nature :
#   - déploiement : AUCUNE (R5) — rien à déclarer, aucune clé prévue ;
#   - données / techniques / exécution : documentaires, jamais bloquantes (R6), ci-dessous.
# Format : - {repository: <dépôt>, kind: data|technical|execution, description: <texte>}
#   kind data      : tables ou fichiers d'un autre Data Product lus par UCS (shortcut, requête) ;
#   kind technical : composant technique partagé (bibliothèque, connexion commune) ;
#   kind execution : ordre d'exécution des traitements (orchestration), jamais de déploiement.
# Aucune dépendance confirmée au 11/11/2026 (__A_RELEVER__DATA_DEPENDENCIES_UCS__).
# ── data_dependencies — dependances documentaires uniquement (jamais bloquantes, R6)
data_dependencies: []
# ── connections — connexions Fabric attendues (resolues par nom a l'execution)
# À relever à l'inventaire (__A_RELEVER__CONNEXIONS_FABRIC_UCS__) : aucune connexion du Framework
# n'est reprise sans preuve de son usage par un item UCS.
# Format : - {name: {DEV: <nom>, ITG: …} ou {_ALL_: <nom>}, purpose: <texte>}
connections: []
# ── variable_libraries — value set attendu actif, par environnement
# À relever à l'inventaire (__A_RELEVER__VARIABLE_LIBRARIES_UCS__).
# Format : - {name: <nom>, expected_active_value_set: {DEV: DEV, ITG: ITG, PPR: PPR, PRD: PRD}}
variable_libraries: []
# ── intentionally_excluded_item_types — types volontairement hors perimetre
intentionally_excluded_item_types: []
# ── guid_policy — GUID interdits (sandbox) et GUID autorises (connexions communes)
# Préfixes interdits dans les items hors règle parameter.yml (GUID_HARDCODED) : workspaces
# UCS Referentiel relevés dans la liste des workspaces par environnement. Ils ne figurent PAS
# dans le registre du socle v1.5.0 (CICD/registry/known_guids.yml, établi à partir des 11
# dépôts initiaux) : ils sont donc déclarés ici. Les capacités et les SPN de l'ancien
# deploy.py sont, eux, déjà au registre.
# À compléter à l'inventaire (__A_RELEVER__GUID_POLICY_UCS__) : workspace sandbox éventuel,
# connexions communes autorisées (allowed).
guid_policy:
  forbidden_prefixes:
  - 8337ccea-   # workspace UCS Referentiel DEV (source Git Integration : à remplacer par règle)
  - e642415a-   # workspace UCS Referentiel ITG (ancien deploy.py)
  - 18955b28-   # workspace UCS Referentiel PPR (ancien deploy.py)
  - 1d9c3851-   # workspace UCS Referentiel PRD (ancien deploy.py)
  allowed: []
  strict_unknown: false
